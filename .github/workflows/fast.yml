name: Fast

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-differential:
    name: Core BER/DER differential against der-parser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select the audited minimum Rust toolchain
        run: |
          rustup toolchain install 1.78.0 --profile minimal
          rustup default 1.78.0
      - name: Restore exact external Cargo registry cache
        id: rust-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: rust-reference-ubuntu-24.04-x86_64-unknown-linux-gnu-1.78.0-${{ hashFiles('differential/rust/Cargo.toml', 'differential/rust/Cargo.lock', 'dependencies/der-parser.json') }}
      - name: Verify a cache hit before acquisition or compilation
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: python3 scripts/check_rust_reference.py --verify-cache
      - name: Acquire locked external crates on a cache miss
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo fetch --locked --manifest-path differential/rust/Cargo.toml
      - name: Verify dependency archives and sources offline
        run: python3 scripts/check_rust_reference.py --verify-cache
      - name: Test runner policies and failure handling
        run: python3 -m unittest discover -s tests -p 'test_rust*.py' -v
      - name: Freshly acquire Core and build both adapters
        run: python3 scripts/setup_rust_differential.py
      - name: Require reproducible agreement, real mismatch and setup-failure reports
        run: python3 scripts/check_rust_differential.py
      - name: Compare the complete reviewed corpus, failing on every shared mismatch
        run: python3 scripts/run_rust_differential.py
      - name: Upload reviewed-corpus reports, provenance and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-differential-reports
          path: |
            build/rust-reports/
            build/rust-provenance.json
            build/rust-runs/*/provenance.json
            build/rust-runs/*/failure.json
            build/rust-runs/*/build.log
            build/rust-runs/*/core-build/CMakeCache.txt
          if-no-files-found: warn

  capabilities:
    name: Lua dependencies and capability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install audit runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.2 liblua5.2-dev luarocks cmake build-essential git unzip zip
      - name: Check dependency policies
        run: python3 -m unittest discover -s tests -v
      - name: Identify external cache
        id: external-key
        run: |
          key=$(python3 scripts/setup_lua.py --print-cache-key --lua lua5.2)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore exact external dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.external-key.outputs.key }}
          key: ${{ steps.external-key.outputs.key }}
      - name: Stage external dependency and freshly install OpenTLV
        run: python3 scripts/setup_lua.py --lua lua5.2
      - name: Verify external cache without network acquisition
        run: python3 scripts/setup_lua.py --lua lua5.2 --external-only --offline
      - name: Compare both libraries on the seed fixtures
        run: >-
          python3 scripts/run_differential.py
          --output build/differential-reports/seed.json --report build/differential-reports/seed.md
      - name: Compare both libraries on the BER corpus
        run: >-
          python3 scripts/run_differential.py --fixtures differential/fixtures/asn1-ber.json
          --output build/differential-reports/asn1-ber.json --report build/differential-reports/asn1-ber.md
      - name: Confirm a real library difference yields a reproducible mismatch report
        run: |
          status=0
          python3 scripts/run_differential.py --fixtures tests/fixtures/differential_mismatch.json \
            --output build/differential-reports/mismatch-probe.json \
            --report build/differential-reports/mismatch-probe.md || status=$?
          test "$status" -eq 3
          python3 scripts/check_report.py build/differential-reports/mismatch-probe.json
      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: differential-reports
          path: build/differential-reports/
          if-no-files-found: warn
      - name: Upload dependency provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-provenance
          path: |
            build/dependency-runs/*/provenance.json
            build/dependency-runs/*/failure.json
            build/dependency-runs/*/*.log
          if-no-files-found: warn

  asn1c-reference:
    name: asn1c reference adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identify asn1c cache
        id: asn1c-key
        run: |
          key=$(python3 scripts/setup_asn1c.py --print-cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore exact asn1c cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.asn1c-key.outputs.key }}
          key: ${{ steps.asn1c-key.outputs.key }}
      - name: Build asn1c, generate the schema and audit the adapter
        run: python3 scripts/setup_asn1c.py
      - name: Verify the asn1c cache without network acquisition
        run: python3 scripts/setup_asn1c.py --offline
      - name: Rerun the capability audit on the built adapter
        run: python3 scripts/check_asn1c.py --output build/asn1c-reports/capabilities.json
      - name: Upload asn1c provenance, logs and audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asn1c-reference
          path: |
            build/asn1c-runs/*/provenance.json
            build/asn1c-runs/*/failure.json
            build/asn1c-runs/*/*.log
            build/asn1c-reports/
          if-no-files-found: warn

  der-differential:
    name: DER differential against asn1c
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Lua and C toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.2 liblua5.2-dev luarocks cmake build-essential git unzip zip
      - name: Identify external caches
        id: keys
        run: |
          echo "lua=$(python3 scripts/setup_lua.py --print-cache-key --lua lua5.2)" >> "$GITHUB_OUTPUT"
          echo "asn1c=$(python3 scripts/setup_asn1c.py --print-cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore exact lua-asn1 cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.keys.outputs.lua }}
          key: ${{ steps.keys.outputs.lua }}
      - name: Restore exact asn1c cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.keys.outputs.asn1c }}
          key: ${{ steps.keys.outputs.asn1c }}
      - name: Freshly install OpenTLV Lua
        run: python3 scripts/setup_lua.py --lua lua5.2
      - name: Build and audit the asn1c reference adapter
        run: python3 scripts/setup_asn1c.py
      - name: Compare OpenTLV and asn1c on the DER corpus
        run: >-
          python3 scripts/run_der_differential.py
          --output build/der-reports/der-canonical.json --report build/der-reports/der-canonical.md
      - name: Confirm a real library difference yields a reproducible mismatch report
        run: |
          status=0
          python3 scripts/run_der_differential.py --fixtures tests/fixtures/der_mismatch.json \
            --output build/der-reports/mismatch-probe.json \
            --report build/der-reports/mismatch-probe.md || status=$?
          test "$status" -eq 3
          python3 scripts/check_report.py build/der-reports/mismatch-probe.json
      - name: Upload DER reports and setup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: der-differential-reports
          path: |
            build/der-reports/
            build/dependency-runs/*/provenance.json
            build/dependency-runs/*/failure.json
            build/asn1c-runs/*/provenance.json
            build/asn1c-runs/*/failure.json
          if-no-files-found: warn

  ber-cer-differential:
    name: BER and CER differential against asn1c
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Lua and C toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.2 liblua5.2-dev luarocks cmake build-essential git unzip zip
      - name: Identify external caches
        id: keys
        run: |
          echo "lua=$(python3 scripts/setup_lua.py --print-cache-key --lua lua5.2)" >> "$GITHUB_OUTPUT"
          echo "asn1c=$(python3 scripts/setup_asn1c.py --print-cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore exact lua-asn1 cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.keys.outputs.lua }}
          key: ${{ steps.keys.outputs.lua }}
      - name: Restore exact asn1c cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependency-cache/${{ steps.keys.outputs.asn1c }}
          key: ${{ steps.keys.outputs.asn1c }}
      - name: Freshly install OpenTLV Lua
        run: python3 scripts/setup_lua.py --lua lua5.2
      - name: Build and audit the asn1c reference adapter
        run: python3 scripts/setup_asn1c.py
      - name: Compare OpenTLV and asn1c on the BER and CER corpus
        run: >-
          python3 scripts/run_ber_cer_differential.py
          --output build/ber-cer-reports/ber-cer-interop.json --report build/ber-cer-reports/ber-cer-interop.md
      - name: Confirm a real library difference yields a reproducible mismatch report
        run: |
          status=0
          python3 scripts/run_ber_cer_differential.py --fixtures tests/fixtures/ber_cer_mismatch.json \
            --output build/ber-cer-reports/mismatch-probe.json \
            --report build/ber-cer-reports/mismatch-probe.md || status=$?
          test "$status" -eq 3
          python3 scripts/check_report.py build/ber-cer-reports/mismatch-probe.json
      - name: Upload BER and CER reports and setup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ber-cer-differential-reports
          path: |
            build/ber-cer-reports/
            build/dependency-runs/*/provenance.json
            build/dependency-runs/*/failure.json
            build/asn1c-runs/*/provenance.json
            build/asn1c-runs/*/failure.json
          if-no-files-found: warn
